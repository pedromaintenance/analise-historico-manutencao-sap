name: Publicar aplicativo no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "src/**"
      - "standalone.html"
      - "package.json"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Testar e preparar site público
    runs-on: ubuntu-latest
    steps:
      - name: Baixar apenas código do repositório
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Executar testes sintéticos
        run: npm test
      - name: Preparar somente arquivos públicos
        shell: bash
        run: |
          mkdir -p _site/src
          cp index.html _site/index.html
          cp src/engine.js _site/src/engine.js
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/src/engine.js
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Disponibilizar site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
